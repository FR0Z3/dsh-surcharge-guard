<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Surcharge guard">
  <defs>
    <linearGradient id="sg-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ee0"/>
      <stop offset="1" stop-color="#2668b8"/>
    </linearGradient>
  </defs>
  <!-- Bracket: a budget being kept under a ceiling. -->
  <path d="M11 6h-3a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h3" fill="none" stroke="#2a6dbd" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M25 6h3a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2h-3" fill="none" stroke="#2a6dbd" stroke-width="2.4" stroke-linecap="round"/>
  <!-- The line the request must not cross. -->
  <path d="M8 13.5h20" stroke="#d8524a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.4 3"/>
  <!-- Content held below it. -->
  <rect x="13" y="18" width="10" height="9" rx="1.8" fill="url(#sg-fill)"/>
  <path d="M15.6 22.6h4.8" stroke="#eaf3ff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
